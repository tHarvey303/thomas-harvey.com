research:
  lead: >-
    I study galaxies in the first few billion years of the Universe. I want to know when and how they formed their stars: their star formation
    histories, the stellar populations they contain, and how much mass they had built. All of that
    has to be inferred from a galaxy's light, so much of my work is testing how far the inference
    can be trusted.
  topics:
    - title: "Resolved galaxies."
      text: >-
        JWST resolves the stellar populations of galaxies at z ≈ 5–10, so we can test whether young
        starbursts are outshining older stars and hiding mass from integrated fits. I wrote
        [EXPANSE](https://github.com/tHarvey303/EXPANSE) to do this systematically, and I am now
        building [arachne](https://github.com/tHarvey303/arachne), which forward-models whole
        multi-band images on a GPU.
      more: >-
        Using 19 NIRCam bands in the JADES Origins Field, I fitted more than 200 galaxies at z ≥ 4.5
        pixel by pixel and compared the result with the usual integrated fit. Low-mass, bursty
        galaxies come out typically 1.25–2.5 times more massive when resolved, and more than ten
        times in individual cases. [Read the paper](/publication/outshining).
    - title: "Fast inference."
      text: >-
        Fitting one galaxy with nested sampling takes minutes to hours, and surveys now contain
        millions. [synference](https://synthesizer-project.github.io/synference/) trains a neural
        posterior estimator on Synthesizer forward models once, then returns a full posterior for a
        new galaxy in milliseconds.
      more: >-
        Simulation-based inference combines the speed of machine learning with Bayesian
        statistics, and speeds up SED fitting by a factor of 10³–10⁵ over conventional sampling.
        [Read the paper](/publication/synference).
    - title: "Euclid Deep Fields."
      text: >-
        JWST sees very deep but over a tiny patch of sky, so the brightest and rarest early galaxies
        are mostly missing from its surveys. The Euclid Deep Fields cover about 53 square degrees in
        the near-infrared, roughly a hundred times the area of the largest JWST survey. I am using
        them to search for luminous galaxies at z > 7, which mostly means telling real distant
        galaxies from the cool brown dwarfs that mimic them.
    - title: "Massive galaxies."
      text: >-
        At MPIA I work with Anna de Graaff on how the most massive early galaxies formed, as part of
        the ERC-funded FIRST-GIANTS project.
    - title: "Black holes and their hosts."
      text: >-
        My Master's research at the Harvard-Smithsonian Center for Astrophysics used Chandra and
        Hubble to study NGC 5972, a galaxy wrapped in gas still glowing from a quasar that has since
        faded.
      more: >-
        The extended emission-line region records how the black hole's output has changed over tens
        of thousands of years. [Read the paper](/publication/ngc5972_feedback).
