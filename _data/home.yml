opened: "Observer's file · opened 2019"
tagline: "How early galaxies formed their stars, read from faint smudges on a detector."
intro: >-
  I'm a postdoctoral researcher at the Max Planck Institute for Astronomy in Heidelberg.
  I use JWST, Hubble and Euclid imaging to work out how galaxies in the early Universe formed
  their stars, and I write the tools that make that inference fast and honest.

