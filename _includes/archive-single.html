{% include base_path %}
<article class="entry">
  {% if post.date %}<span class="type">{{ post.date | date: "%Y %b %d" }}</span>{% endif %}
  <h3><a href="{{ base_path }}{{ post.url }}" rel="permalink">{{ post.title }}</a></h3>
  {% assign blurb = post.excerpt | strip_html | strip %}
  {% if blurb != "" %}<p>{{ blurb | truncatewords: 45 }}</p>{% endif %}
</article>
