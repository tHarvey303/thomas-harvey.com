<div class="ledger" style="--cols:8.5rem 3.5rem 1fr 3rem">
  <div class="head"><span>Programme</span><span>Role</span><span>Title</span><span>Year</span></div>
  {% for p in site.data.proposals %}
    <div class="row"><span>{{ p.facility }} {{ p.id }}</span><span class="h">{{ p.role }}</span><span>{{ p.title }}</span><span>{{ p.year }}</span></div>
  {% endfor %}
</div>
